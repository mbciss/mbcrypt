name: build-linux
on: [push, pull_request]
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev libssl-dev pkg-config
      - name: Build CLI
        run: make -C mbcrypt
      - name: Smoke test
        run: ./mbcrypt/mbcrypt --help || true